<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent 从0到1</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e; color: #e0e0e0;
  height: 100vh; display: flex; flex-direction: column;
}

/* ── 顶栏 ── */
header {
  background: #16213e; padding: 12px 20px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid #0f3460;
}
header h1 { font-size: 18px; color: #e94560; }
header .actions { display: flex; gap: 8px; }
header button {
  background: #0f3460; color: #e0e0e0; border: none;
  padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
}
header button:hover { background: #1a4a7a; }

/* ── 聊天区 ── */
#chat {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
}
.msg { max-width: 85%; padding: 10px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: #e94560; color: #fff; border-bottom-right-radius: 4px; }
.msg.agent { align-self: flex-start; background: #16213e; border: 1px solid #0f3460; border-bottom-left-radius: 4px; }
.msg.agent.streaming { border-color: #e94560; }

/* 工具调用卡片 */
.tool-card {
  align-self: flex-start; background: #1a2744; border: 1px solid #e94560;
  border-radius: 8px; padding: 8px 14px; font-size: 13px; margin: 4px 0;
}
.tool-card .tool-name { color: #e94560; font-weight: bold; }
.tool-card .tool-args { color: #999; font-size: 12px; margin-top: 4px; }
.tool-card .tool-result { color: #aaa; font-size: 12px; margin-top: 4px; border-top: 1px solid #0f3460; padding-top: 4px; }

/* 加载动画 */
.loading {
  align-self: flex-start; padding: 12px 20px; display: flex; gap: 6px;
}
.loading span {
  width: 8px; height: 8px; background: #e94560; border-radius: 50%;
  animation: bounce 1.2s infinite ease-in-out;
}
.loading span:nth-child(2) { animation-delay: 0.2s; }
.loading span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-10px); }
}

/* ── 输入区 ── */
footer {
  background: #16213e; padding: 12px 20px;
  border-top: 1px solid #0f3460; display: flex; gap: 10px;
}
footer input {
  flex: 1; background: #1a1a2e; border: 1px solid #0f3460; color: #e0e0e0;
  padding: 10px 16px; border-radius: 8px; font-size: 14px; outline: none;
}
footer input:focus { border-color: #e94560; }
footer button {
  background: #e94560; color: #fff; border: none;
  padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold;
}
footer button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── 会话列表弹窗 ── */
.modal {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center;
}
.modal.show { display: flex; }
.modal .inner {
  background: #16213e; border-radius: 12px; padding: 24px; width: 90%; max-width: 500px;
  max-height: 70vh; overflow-y: auto;
}
.modal .inner h2 { margin-bottom: 16px; font-size: 18px; }
.session-item {
  padding: 12px; border: 1px solid #0f3460; border-radius: 8px; margin-bottom: 8px;
  cursor: pointer; display: flex; justify-content: space-between; align-items: center;
}
.session-item:hover { border-color: #e94560; }
.session-item .info { flex: 1; }
.session-item .info .date { font-size: 12px; color: #999; }
.session-item .info .preview { font-size: 13px; margin-top: 4px; }
.session-item .del-btn { background: none; border: none; color: #e94560; cursor: pointer; font-size: 18px; padding: 4px 8px; }

/* ── 快捷提示 ── */
.hints {
  display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 8px;
}
.hints button {
  background: #16213e; border: 1px solid #0f3460; color: #999;
  padding: 6px 12px; border-radius: 16px; cursor: pointer; font-size: 12px;
}
.hints button:hover { border-color: #e94560; color: #e0e0e0; }

/* 滚动条 */
#chat::-webkit-scrollbar { width: 6px; }
#chat::-webkit-scrollbar-track { background: #1a1a2e; }
#chat::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>🤖 Agent 从0到1</h1>
  <div class="actions">
    <button onclick="showSessions()">📋 对话记录</button>
    <button onclick="newSession()">✨ 新对话</button>
  </div>
</header>

<div id="chat"></div>

<div class="hints" id="hints">
  <button onclick="sendHint('现在几点了？')">🕐 现在几点</button>
  <button onclick="sendHint('北京天气怎么样？')">🌤️ 查天气</button>
  <button onclick="sendHint('帮我算 128*256')">🧮 计算</button>
  <button onclick="sendHint('最近有什么科技新闻？')">🌐 搜新闻</button>
  <button onclick="sendHint('什么是闭包？')">📚 查知识库</button>
</div>

<footer>
  <input id="input" type="text" placeholder="输入消息，Enter 发送..." autofocus>
  <button id="sendBtn" onclick="send()">发送</button>
</footer>

<!-- 会话列表弹窗 -->
<div class="modal" id="sessionModal">
  <div class="inner">
    <h2>📋 对话记录</h2>
    <div id="sessionList"></div>
    <button onclick="closeModal()" style="margin-top:12px;background:#0f3460;color:#e0e0e0;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;width:100%;">关闭</button>
  </div>
</div>

<script>
let currentSessionId = new Date().toISOString().slice(0, 10);
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const hintsEl = document.getElementById("hints");

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

function scrollBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ── 发送消息 ──
async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  // 禁用输入
  inputEl.disabled = true;
  sendBtn.disabled = true;
  hintsEl.style.display = "none";

  // 用户消息
  addMessage("user", text);
  inputEl.value = "";
  scrollBottom();

  // 加载指示器
  const loadingEl = addLoading();

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, sessionId: currentSessionId }),
    });

    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`服务器返回 ${resp.status}: ${errText.slice(0, 100)}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let agentMsgEl = null;
    let currentToolCard = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const event = JSON.parse(line.slice(6));

        switch (event.type) {
          case "start":
            loadingEl?.remove();
            agentMsgEl = addMessage("agent", "", "streaming");
            break;

          case "text":
            if (agentMsgEl) {
              agentMsgEl.textContent += event.text;
              scrollBottom();
            }
            break;

          case "tool_start":
            currentToolCard = addToolCard(`🔧 ${event.tool}`, JSON.stringify(event.args));
            break;

          case "tool_result":
            if (currentToolCard) {
              currentToolCard.innerHTML += `<div class="tool-result">📦 ${escapeHtml(event.result)}</div>`;
            }
            break;

          case "tool_error":
            if (currentToolCard) {
              currentToolCard.innerHTML += `<div class="tool-result" style="color:#e94560">❌ ${event.error}</div>`;
            }
            break;

          case "generating":
            // 工具执行完，准备生成文本
            break;

          case "done":
            if (agentMsgEl) agentMsgEl.classList.remove("streaming");
            break;

          case "error":
            addMessage("agent", `❌ 错误：${event.error}`);
            break;
        }
      }
    }
  } catch (e) {
    addMessage("agent", `❌ 连接失败：${e.message}`);
  }

  // 恢复输入
  inputEl.disabled = false;
  sendBtn.disabled = false;
  hintsEl.style.display = "flex";
  inputEl.focus();
}

// ── UI 工具函数 ──
function addMessage(role, text, className) {
  const el = document.createElement("div");
  el.className = `msg ${role}${className ? " " + className : ""}`;
  el.textContent = text;
  chatEl.appendChild(el);
  return el;
}

function addToolCard(tool, args) {
  const el = document.createElement("div");
  el.className = "tool-card";
  el.innerHTML = `<div class="tool-name">${escapeHtml(tool)}</div><div class="tool-args">参数：${escapeHtml(args)}</div>`;
  chatEl.appendChild(el);
  scrollBottom();
  return el;
}

function addLoading() {
  const el = document.createElement("div");
  el.className = "loading";
  el.innerHTML = "<span></span><span></span><span></span>";
  chatEl.appendChild(el);
  scrollBottom();
  return el;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ── 快捷提示 ──
function sendHint(text) {
  inputEl.value = text;
  send();
}

// ── 会话管理 ──
function newSession() {
  currentSessionId = new Date().toISOString().slice(0, 10) + "-" + Date.now();
  chatEl.innerHTML = "";
  addMessage("agent", "✨ 新对话开始！有什么可以帮你的？");
}

async function showSessions() {
  document.getElementById("sessionModal").classList.add("show");
  const listEl = document.getElementById("sessionList");
  listEl.innerHTML = "<div class='loading'><span></span><span></span><span></span></div>";

  try {
    const resp = await fetch("/api/sessions");
    const sessions = await resp.json();
    listEl.innerHTML = sessions.length === 0
      ? "<p style='color:#999'>暂无对话记录</p>"
      : sessions.map(s => `
        <div class="session-item" onclick="loadSession('${s.id}')">
          <div class="info">
            <div class="date">📅 ${s.id}</div>
            <div class="preview">${escapeHtml(s.last || "(空)")}</div>
          </div>
          <button class="del-btn" onclick="event.stopPropagation();deleteSession('${s.id}')" title="删除">🗑️</button>
        </div>
      `).join("");
  } catch {
    listEl.innerHTML = "<p style='color:#e94560'>加载失败</p>";
  }
}

function closeModal() {
  document.getElementById("sessionModal").classList.remove("show");
}

async function loadSession(id) {
  currentSessionId = id;
  chatEl.innerHTML = "";
  addMessage("agent", `📂 已加载对话：${id}（发送消息继续）`);
  closeModal();
}

async function deleteSession(id) {
  if (!confirm("确定删除这个对话？")) return;
  await fetch(`/api/sessions/${id}`, { method: "DELETE" });
  showSessions();
}

// 初始欢迎消息
addMessage("agent", "👋 你好！我是你的全能 Agent。\n\n我可以：\n🌐 联网搜索最新信息\n📚 搜索你的本地知识库\n🧮 计算数学表达式\n🕐 查询时间\n🌤️ 查询天气\n💾 保存知识到你自己的知识库\n\n试试上面的快捷按钮，或直接输入问题开始！");
</script>
</body>
</html>
